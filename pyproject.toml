[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-scan-backend"
version = "0.1.0"
description = "UK contract-risk backend — judgment ingest first (Find Case Law), multi-service monorepo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Contract Scan" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
judgment-ingest = "judgment_ingest.cli:app"

[tool.setuptools.package-dir]
"" = "src/services"

[tool.setuptools.packages.find]
where = ["src/services"]
include = ["judgment_ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/services"]
